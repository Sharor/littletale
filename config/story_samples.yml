- slug: nora-and-the-little-lost-star
  title: Nora and the Little Lost Star
  reader_age: 5
  art_style: Cute cartoon
  source_book_id: 6
  pages:
    - number: 1
      image: story_samples/nora-and-the-little-lost-star/page-1.webp
      alt: Nora finds a tiny glowing star on her bedroom windowsill.
      text: "Nora, in her mustard-yellow pajamas and brown slippers, peeked at her windowsill. There sat a tiny, softly glowing star, shivering and lost. It had tumbled down from the sky and couldn’t remember where it belonged. Nora waved gently and whispered, 'Don’t be afraid.'"
    - number: 2
      image: story_samples/nora-and-the-little-lost-star/page-2.webp
      alt: Nora carries the little star along a silver moonlit path.
      text: "Moonlight painted a winding silver path across the floor. Nora carefully picked up the little star and tiptoed along the glowing trail. Her stuffed animals and blocks cast huge, cheerful shadows on the walls, waving as Nora passed by with her twinkling friend."
    - number: 3
      image: story_samples/nora-and-the-little-lost-star/page-3.webp
      alt: Nora and the little star look into a bowl of moonlit water.
      text: "The moonlight path ended at Nora’s bowl of water. She held the star above it. In the water, the star saw its reflection and squeaked, 'Another lost star!' But Nora peered up and noticed an empty spot in the constellation above her window."
    - number: 4
      image: story_samples/nora-and-the-little-lost-star/page-4.webp
      alt: The little star rises toward its constellation in the night sky.
      text: "Nora carefully lifted the bowl into the moonlight. The water sparkled, sending shimmering light up to the window. The constellation’s stars twinkled back. The little star recognized its family, shone even brighter, and floated gently up, home at last."
    - number: 5
      image: story_samples/nora-and-the-little-lost-star/page-5.webp
      alt: Nora falls asleep as the little star twinkles outside her window.
      text: "Nora tucked herself into bed, her slippers on the rug. Outside, one star gave three tiny twinkles. Nora giggled sleepily and answered with three slow blinks. Safe in her cozy room, she drifted off to dreamland, knowing the stars were watching."

- slug: leo-and-adas-moon-garden
  title: Leo and Ada’s Moon Garden
  reader_age: 6
  art_style: Colored pencil
  source_book_id: 7
  pages:
    - number: 1
      image: story_samples/leo-and-adas-moon-garden/page-1.webp
      alt: Leo and Ada discover a glass greenhouse on the moon.
      text: "Leo and his big sister Ada landed their cream-colored rocket with a gentle bump. Outside, a shiny glass greenhouse sat in a moon crater. Inside, rows of closed silver flower buds waited quietly. Leo pressed his face to his helmet, eager to explore. Ada grinned, ready for a new space adventure."
    - number: 2
      image: story_samples/leo-and-adas-moon-garden/page-2.webp
      alt: Ada waters silver flower buds while Leo watches.
      text: "Ada picked up a bright watering can and sprinkled water over the silver buds. Leo watched, hoping for magic. But the flowers stayed shut. Suddenly, when Leo’s boot squeaked on the floor, one bud twitched! Ada giggled. 'Maybe they like funny sounds,' Leo said, eyes wide."
    - number: 3
      image: story_samples/leo-and-adas-moon-garden/page-3.webp
      alt: A moon flower opens as Leo taps a rhythm on his helmet.
      text: "Leo tried tapping a silly beat on his helmet: tap-tap, tap-tap! Suddenly, a flower popped open with a tiny pink flash. When he stopped tapping, the flower closed again. Ada laughed. 'You’re a moon musician, Leo!' she said, clapping her gloved hands."
    - number: 4
      image: story_samples/leo-and-adas-moon-garden/page-4.webp
      alt: Leo and Ada dance among glowing flowers in the moon garden.
      text: "Leo tapped a rhythm while Ada clapped along. The silver buds began to glow—first pink, then orange, then blue! Soon, the whole garden was blooming with magical, glowing flowers. The siblings spun and danced, surrounded by bright, colorful lights. Leo grinned, 'We’re the best space band ever!'"
    - number: 5
      image: story_samples/leo-and-adas-moon-garden/page-5.webp
      alt: The glowing moon garden waves goodbye to Leo and Ada’s rocket.
      text: "Back in their rocket, Leo and Ada watched the flowers blink through the greenhouse roof. Leo tapped goodbye on the window. The garden flashed pink, orange, and blue, waving back in flower language. Ada hugged Leo. 'Best adventure yet!' she whispered as their rocket floated home."

- slug: sami-and-the-fort-for-two
  title: Sami and the Fort for Two
  reader_age: 6
  art_style: Claymation
  source_book_id: 8
  pages:
    - number: 1
      image: story_samples/sami-and-the-fort-for-two/page-1.webp
      alt: Sami builds a pirate ship fort from chairs and a blue blanket.
      text: "Sami stacked chairs side by side in the living room. He spread a big blue blanket across the top—it looked just like a pirate ship! 'Ahoy, Lina!' he called. 'Come join my ship! We can sail to hidden treasure!' Sami wore his favorite rust-orange sweatshirt and navy trousers, ready for adventure."
    - number: 2
      image: story_samples/sami-and-the-fort-for-two/page-2.webp
      alt: Lina adds paper stars to the fort while Sami considers her idea.
      text: "Lina hurried in, holding shiny paper stars and a cardboard telescope. She wore her sage-green sweater and blue jeans. 'Let’s pretend it’s a space station!' Lina said, hanging stars on the blanket. Sami shook his head. 'But I want a pirate ship!' Lina frowned. Neither wanted to change their plan."
    - number: 3
      image: story_samples/sami-and-the-fort-for-two/page-3.webp
      alt: Sami notices Lina’s sparkling stars and thinks of a new idea.
      text: "Sami and Lina sat quietly on opposite sides of the half-made fort. Sami peeked at Lina’s sparkly paper stars. He remembered that sailors use stars to find their way across the sea. Maybe the stars could help his pirate ship too. He started to smile, thinking of a new idea."
    - number: 4
      image: story_samples/sami-and-the-fort-for-two/page-4.webp
      alt: Sami and Lina turn their fort into a space pirate ship together.
      text: "'What if our ship sails through space?' Sami said. Lina’s eyes lit up. 'Yes! Let’s make a star window!' She taped a big star above the opening. Together, they slid a big cushion into the fort. 'Captain’s seat!' Lina grinned. It was wide enough for both of them to sit side by side."
    - number: 5
      image: story_samples/sami-and-the-fort-for-two/page-5.webp
      alt: Sami and Lina explore from inside their finished space pirate fort.
      text: "Under the blue blanket and twinkling paper stars, Sami and Lina took turns peeking through the cardboard telescope. 'Look! A planet shaped like a biscuit!' Lina giggled. Sami nodded. 'Let’s make it our first stop!' Their space-pirate ship was ready for any adventure—especially together."
