# Name of your application. Used to uniquely configure containers.
service: little_stories

# Name of the container image.
image: little_stories

# Deploy to these servers.
servers:
  web:
    - 192.168.0.1
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Replace this host before the first deployment. Keep a single web host while
# SQLite is in use so every process shares the same persistent filesystem.
proxy:
  ssl: true
  host: littletale.com

# The Rails 8.1 generator defaults to a local registry. Replace this block when
# using Docker Hub, GHCR, or another authenticated registry.
registry:
  server: localhost:5555

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - OPENAI_ACCESS_TOKEN
    - MINIO_ACCESS_KEY
    - MINIO_SECRET_KEY
    - MINIO_BUCKET
    - MINIO_ENDPOINT
    - HOSTS
    - METRICS_BEARER_TOKEN
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"


# Use a persistent storage volume for SQLite database files and other local runtime files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "little_stories_storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# Alloy is the only monitoring component on the application host. Metrics and
# logs are shipped to the backend configured by environment variables, so the
# collector can later target a self-hosted Prometheus-compatible stack.
accessories:
  alloy:
    image: grafana/alloy:v1.19.2
    host: 192.168.0.1
    cmd: "run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy"
    port: "127.0.0.1:12345:12345"
    env:
      clear:
        RAILS_METRICS_HOST: littletale.com
        RAILS_METRICS_SCHEME: https
      secret:
        - METRICS_WRITE_URL
        - METRICS_USERNAME
        - LOGS_WRITE_URL
        - LOGS_USERNAME
        - OBSERVABILITY_WRITE_TOKEN
        - METRICS_BEARER_TOKEN
    files:
      - config/observability/config.alloy:/etc/alloy/config.alloy:ro
    directories:
      - alloy-data:/var/lib/alloy/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    options:
      restart: always
      memory: 256m
      cpus: 0.5
      pid: host

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.2.2
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# No database, cache, queue, cable, or Redis accessory is required. They use
# SQLite files in the persistent storage volume above.
