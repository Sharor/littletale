service: minortale
image: sharor/minortale

servers:
  web:
    - 146.190.234.192

proxy:
  ssl: true
  hosts:
    - minortale.com
    - www.minortale.com
  run:
    # Signed Lulu artifact capabilities can appear in the proxy's host-local log.
    # Retain only one tightly bounded file; Rails and Alloy redact the path.
    log_max_size: "1m"
    options:
      log-opt:
        - "max-file=1"

registry:
  username: sharor
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    # - OPENAI_ACCESS_TOKEN
    # - MINIO_ACCESS_KEY
    # - MINIO_SECRET_KEY
    # - MINIO_BUCKET
    # - MINIO_ENDPOINT
    # - HOSTS

  clear:
    SOLID_QUEUE_IN_PUMA: true

    # Lulu Orders remains an admin-only sandbox pilot until explicitly enabled.
    # Lulu fetches signed PDFs from this public HTTPS application host.
    LULU_ORDERS_ENABLED: "false"
    LULU_ASSET_HOST: "https://minortale.com"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "minortale_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
