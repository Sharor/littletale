    create_book: Enter a name for your book, it'll be the title.
    create_book_finish: When you're happy with it, continue to add characters to your book!
    create_character: Any good story needs heroes and villains! Create the first character of your story...
    reuse_character: ...or reuse one from an old story (which you cannot do yet of course)!
    character_generation: When created, they'll appear here - and after a moment, will be drawn for you to see.<br/><br/> You can also remake them if you're not happy with the current image. 
    ready: Finally, when you are happy with the characters you want to be in the book, you click here and give a description of the book's plot! <br/><br/>Then we'll have a book written and illustrated for you in no time!
    character_creation: Creating a character is simple. You decide a name, and how they look. 
    character_looks: Things like their age, gender, hair, eyes...
    character_attributes: ... and some traits that help give them a more precise overall look. 
    character_ready: When you're content with the character's setup, we'll illustrate it for you! If you don't like them, you can re-draw them.
    character_select: It's easier to select existing characters to add, than make them again! <br><br>Simply click on all the ones you want to add and they will be highlighted.<br><br> Should you wish to remove them, simply click them again and save.
    character_select_ready: Then click here and they'll be added, or removed in the overview.
    book_plot: Now all that is left to do, is tell what you want the story to be and we work our magic!
    book_ready: Click here when you are ready for us to write and illustrate your book, and the fairies and elves will get right on it. <br><br>The wizard might be nice and speed up the process if he's in the mood. 
