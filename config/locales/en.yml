    eyebrow: Personalized illustrated stories
    title: Their next adventure starts with them.
    introduction: Create an illustrated story starring your child. Add a photo or describe their character, choose what happens, and read the story together online.
    create: Create your child’s story
    read_sample: Read a sample story
    trial_short: Start with 3 trial books · Up to 5 pages each
    hero_caption: Made from a simple idea for a child named Nora.
    samples:
      eyebrow: Read before you create
      title: Three small worlds, ready to open
      introduction: These complete five-page stories were made with LittleStories. Turn every page and see how different characters, plots, and illustration styles come together.
      read: Read this story
      age: For age %{age}
      style_note: Cute cartoon, colored pencil, claymation, and many more illustration styles are available when you create your story.
    steps:
      eyebrow: How it works
      title: You bring what makes them special. We turn it into a story.
      character:
        title: Make their character
        description: Add a photo or describe how your child should appear. You can include siblings, friends, and favorite companions too.
      adventure:
        title: Shape the adventure
        description: Choose the characters, language, illustration style, and the idea you want the story to follow.
      read:
        title: Read it together
        description: LittleStories writes and illustrates the pages, then keeps the finished book in your online library.
    personal:
      eyebrow: Made around your child
      title: A story that knows who the hero is
      introduction: Keep the details that matter to your family while giving every new story a world of its own.
      recognizable:
        title: Recognizably theirs
        description: Use their name, appearance, interests, and the people they love.
      guided:
        title: Guided by you
        description: Set the premise and cast. LittleStories develops them into a complete short adventure.
      varied:
        title: A different world each time
        description: Pick a visual style and story language that suits tonight’s idea.
    trial:
      eyebrow: Begin with a little shelf
      title: Try three stories before you decide
      description: Your trial includes three books, each with up to five illustrated pages. Your one-month reading period begins when your first book is complete.
      terms: 3 trial books · Up to 5 pages each · One month of reading from your first completed book
      action: Start your first story
      sign_in_note: Sign in securely with Google or Microsoft.
    faq:
      eyebrow: Good to know
      title: Questions parents ask
      items:
        ai:
          question: How does LittleStories make the book?
          answer: LittleStories uses AI to turn your characters and plot into story text and illustrations. You choose the characters, language, and visual style.
        language:
          question: Which languages can I use?
          answer: You can create stories in English, Danish, or Greek.
        photo:
          question: Do I need a photo?
          answer: No. You can upload a photo or create the character from a written description.
        child:
          question: Can a story include more than one child?
          answer: Yes. Build a cast from your saved characters, including siblings, friends, and grown-ups.
        time:
          question: Do I need to wait on the page while the book is made?
          answer: No. Story and illustration generation continue in the background, and the completed book appears in your library.
        reading:
          question: Where do we read the finished story?
          answer: Every book lives in your LittleStories online library, ready to read page by page.
        trial:
          question: When does the trial month begin?
          answer: The one-month reading period begins when your first trial book is complete.
    final:
      eyebrow: A new favorite can start here
      title: Who will they become tonight?
      description: Bring one child, one idea, and a few details. LittleStories will help you make the book you read together.
      action: Create your child’s story
    footer:
      note: Personalized stories for reading together.
