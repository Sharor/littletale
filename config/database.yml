# SQLite stores application data in files under storage/. Kamal mounts that
# directory as a persistent volume in production.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    # An explicit URL prevents an inherited DATABASE_URL from switching adapters.
    url: <%= "sqlite3:#{Rails.root.join("storage/development.sqlite3")}" %>
  queue:
    <<: *default
    url: <%= "sqlite3:#{Rails.root.join("storage/development_queue.sqlite3")}" %>
    migrations_paths: db/queue_migrate

test:
  <<: *default
  url: <%= "sqlite3:#{Rails.root.join("storage/test.sqlite3")}" %>

production:
  primary:
    <<: *default
    url: <%= "sqlite3:#{Rails.root.join("storage/production.sqlite3")}" %>
  cache:
    <<: *default
    url: <%= "sqlite3:#{Rails.root.join("storage/production_cache.sqlite3")}" %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= "sqlite3:#{Rails.root.join("storage/production_queue.sqlite3")}" %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= "sqlite3:#{Rails.root.join("storage/production_cable.sqlite3")}" %>
    migrations_paths: db/cable_migrate
