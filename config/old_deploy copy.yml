service: minortale
image: sharor/minortale

servers:
  web:
    - linux9.unoeuro.com

proxy:
  ssl: true
  host: minortale.com

registry:
  username: sharor
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - OPENAI_ACCESS_TOKEN
    - MINIO_ACCESS_KEY
    - MINIO_SECRET_KEY
    - MINIO_BUCKET
    - MINIO_ENDPOINT
    - HOSTS
    - METRICS_BEARER_TOKEN

  clear:
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "minortale_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64